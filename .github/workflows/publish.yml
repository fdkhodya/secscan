name: build-secscan-image

# Сборка образа secscan и публикация в GitHub Container Registry (ghcr.io)
# на каждый push в main (+ ручной запуск из вкладки Actions).
# Образ: ghcr.io/fdkhodya/secscan:latest (+ тег по SHA коммита для отката).
# Рантайм-конфиг (docker_compose.yml в Home) тянет образ: docker compose
# up -d --pull always --force-recreate — локальная сборка на хосте не нужна.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Новый пакет ghcr создаётся приватным; переключаем на public, чтобы
      # образ тянулся с любой машины без docker login (best effort).
      - name: Make package public (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/secscan/visibility \
            -d '{"visibility":"public"}' || true

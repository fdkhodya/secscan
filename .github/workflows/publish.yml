name: build-secscan-image

# Сборка образов secscan и публикация в GitHub Container Registry (ghcr.io)
# на каждый push в main (+ ручной запуск из вкладки Actions).
#   * ghcr.io/fdkhodya/secscan:latest   — обычный образ (сканеры разовыми
#     контейнерами, docker.sock); его тянет рантайм-конфиг в Home:
#     docker compose up -d --pull always --force-recreate;
#   * ghcr.io/fdkhodya/secscan:allinone — «всё в одном» (nmap + ZAP + nuclei
#     + testssl.sh внутри одного контейнера, SECSCAN_ENGINE_MODE=local),
#     linux/amd64 + linux/arm64 — для Docker Desktop (macOS/Windows).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Новый пакет ghcr создаётся приватным; переключаем на public, чтобы
      # образ тянулся с любой машины без docker login (best effort).
      - name: Make package public (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/secscan/visibility \
            -d '{"visibility":"public"}' || true

  # Образ «всё в одном»: веб-интерфейс и все движки-сканеры (nmap, OWASP ZAP,
  # nuclei, testssl.sh) внутри одного контейнера, движки — локальные процессы
  # (SECSCAN_ENGINE_MODE=local). Нужен там, где docker.sock из контейнера
  # недоступен (Docker Desktop: macOS/Windows). Мультиарх: amd64 + arm64,
  # чтобы образ тянулся на Apple Silicon нативно.
  build-push-allinone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push allinone (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allinone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:allinone
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

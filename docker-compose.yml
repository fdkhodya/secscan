# secscan — локальный сканер уязвимостей.
#
#   docker compose up -d --build
#
# Движки-сканеры (nmap, OWASP ZAP, nuclei, testssl.sh) запускаются разовыми
# docker-контейнерами через docker.sock хоста; образы подтягиваются при
# первом использовании (переопределяются SECSCAN_*_IMAGE).
# Секреты — из .env рядом с этим файлом (SECSCAN_PASS и др.).
services:
  secscan:
    build: .
    image: secscan:latest
    container_name: secscan
    restart: always
    ports:
      - "8510:8510"
    environment:
      SECSCAN_USER: ${SECSCAN_USER:-admin}
      SECSCAN_PASS: ${SECSCAN_PASS:?укажите SECSCAN_PASS в .env}
      SECSCAN_DATA: /data
      # хост-путь к ./data: в него монтируются рабочие каталоги сканеров (ZAP,
      # nuclei-шаблоны) и он же используется для docker -v
      SECSCAN_HOST_DATA: ${SECSCAN_HOST_DATA:-/opt/projects/secscan/data}
      SECSCAN_ZAP_ENABLED: ${SECSCAN_ZAP_ENABLED:-1}
      SECSCAN_NUCLEI_ENABLED: ${SECSCAN_NUCLEI_ENABLED:-1}
      SECSCAN_UDP_ENABLED: ${SECSCAN_UDP_ENABLED:-0}
      SECSCAN_NSE_ENABLED: ${SECSCAN_NSE_ENABLED:-1}
      SECSCAN_NMAP_VULNERS: ${SECSCAN_NMAP_VULNERS:-1}
      SECSCAN_SSL_ENABLED: ${SECSCAN_SSL_ENABLED:-1}
      SECSCAN_NMAP_IMAGE: ${SECSCAN_NMAP_IMAGE:-instrumentisto/nmap:latest}
      SECSCAN_ZAP_IMAGE: ${SECSCAN_ZAP_IMAGE:-ghcr.io/zaproxy/zaproxy:stable}
      SECSCAN_NUCLEI_IMAGE: ${SECSCAN_NUCLEI_IMAGE:-projectdiscovery/nuclei:v2.9.14}
      SECSCAN_SSL_IMAGE: ${SECSCAN_SSL_IMAGE:-drwetter/testssl.sh:latest}
      # локальный часовой пояс (времена задач: список, отчёты, PDF)
      SECSCAN_TZ: ${SECSCAN_TZ:-Asia/Yekaterinburg}
      # поиск соседних сайтов на IP цели (TLS + crt.sh)
      SECSCAN_CRTSH: ${SECSCAN_CRTSH:-1}
    volumes:
      - ./data:/data
      # Хостовый каталог данных дублируется в контейнер по пути
      # SECSCAN_HOST_DATA: рабочие каталоги сканеров (data/work/<job>,
      # data/nuclei-templates) secscan создаёт ИМЕННО там, а docker -v
      # монтирует их в контейнеры сканеров по хостовому пути — пути должны
      # совпадать. При другом расположении проекта задайте SECSCAN_HOST_DATA
      # в .env (абсолютный путь к ./data на хосте).
      - ./data:${SECSCAN_HOST_DATA:-/opt/projects/secscan/data}
      - /var/run/docker.sock:/var/run/docker.sock

# secscan + Greenbone Community Edition (OpenVAS) — ОДИН compose-стек.
#
#   docker compose up -d --build                  # только secscan (сервер без
#                                                 # достаточной RAM: Greenbone
#                                                 # НЕ запускается)
#   docker compose --profile greenbone up -d      # весь стек: secscan +
#                                                 # Greenbone CE (требует
#                                                 # ~4-8 ГБ RAM и ~20-60 ГБ диска)
#
# Секреты secscan — из .env рядом с этим файлом (SECSCAN_PASS и др.).
# Связь secscan с Greenbone: GMP по общему unix-сокету /run/gvmd/gvmd.sock
# (volume gvmd_socket_vol монтируется и в gvmd, и в secscan) — как у штатных
# gsad/gvm-tools: без TCP-портов, TLS-сертификатов и внешних мостов.
# Пароль администратора gvmd (admin): при первом старте стека выполнить
#   docker compose exec -u gvmd gvmd gvmd --user=admin --new-password='<пароль>'
# и прописать тот же пароль в SECSCAN_GMP_PASS (см. README.md).
#
# Greenbone-сервисы — официальный compose Greenbone Community Containers
# (docs.greenbone.net, «Docker Compose File»), изменения:
#   - каждому сервису добавлен профиль greenbone (обычный `up` их не трогает);
#   - nginx слушает 127.0.0.1:443/9392 (переопределяется GC_GSA_PORT /
#     GC_GSA_API_PORT, напр. GC_GSA_PORT=0.0.0.0:8443);
#   - добавлен сервис secscan (локальная сборка) + volume gvmd_socket_vol в нём.

services:
  secscan:
    build: .
    image: secscan:latest
    container_name: secscan
    restart: always
    ports:
      - "8510:8510"
    environment:
      SECSCAN_USER: ${SECSCAN_USER:-admin}
      SECSCAN_PASS: ${SECSCAN_PASS:?укажите SECSCAN_PASS в .env}
      SECSCAN_DATA: /data
      # хост-путь к ./data: в него монтируются рабочие каталоги сканеров (ZAP)
      SECSCAN_HOST_DATA: ${SECSCAN_HOST_DATA:-/opt/projects/secscan/data}
      SECSCAN_ZAP_ENABLED: ${SECSCAN_ZAP_ENABLED:-1}
      SECSCAN_NMAP_VULNERS: ${SECSCAN_NMAP_VULNERS:-1}
      # OpenVAS/Greenbone: включать только когда запущен профиль greenbone
      SECSCAN_OPENVAS_ENABLED: ${SECSCAN_OPENVAS_ENABLED:-0}
      SECSCAN_GMP_SOCKET: /run/gvmd/gvmd.sock
      SECSCAN_GMP_USER: ${SECSCAN_GMP_USER:-admin}
      SECSCAN_GMP_PASS: ${SECSCAN_GMP_PASS:-}
      # локальный часовой пояс (времена задач: список, отчёты, PDF)
      SECSCAN_TZ: ${SECSCAN_TZ:-Asia/Yekaterinburg}
      # поиск соседних сайтов на IP цели (TLS + crt.sh)
      SECSCAN_CRTSH: ${SECSCAN_CRTSH:-1}
    volumes:
      - ./data:/data
      # Хостовый каталог данных дублируется в контейнер по пути
      # SECSCAN_HOST_DATA: рабочие каталоги сканеров (data/work/<job>) secscan
      # создаёт ИМЕННО там, а docker -v монтирует их в контейнеры nmap/ZAP по
      # хостовому пути — пути должны совпадать (см. scanners.go, zapScan).
      # При другом расположении проекта задайте SECSCAN_HOST_DATA в .env
      # (абсолютный путь к ./data на хосте) — он подставится в оба места.
      - ./data:${SECSCAN_HOST_DATA:-/opt/projects/secscan/data}
      - /var/run/docker.sock:/var/run/docker.sock
      # сокет gvmd (Greenbone): смонтирован, только когда стек запущен
      - gvmd_socket_vol:/run/gvmd:ro

  # ================= Greenbone Community Edition (профиль greenbone) =================

  vulnerability-tests:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/vulnerability-tests
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - vt_data_vol:/mnt

  notus-data:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/notus-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - notus_data_vol:/mnt

  scap-data:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/scap-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - scap_data_vol:/mnt

  cert-bund-data:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/cert-bund-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt

  dfn-cert-data:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/dfn-cert-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt
    depends_on:
      cert-bund-data:
        condition: service_healthy

  data-objects:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/data-objects
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt

  report-formats:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/report-formats
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt
    depends_on:
      data-objects:
        condition: service_healthy

  gpg-data:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/gpg-data
    volumes:
      - gpg_data_vol:/mnt

  redis-server:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/redis-server
    deploy:
      restart_policy:
        condition: any
    volumes:
      - redis_socket_vol:/run/redis/

  pg-gvm:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/pg-gvm:stable
    deploy:
      restart_policy:
        condition: any
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm-migrator:
        condition: service_completed_successfully

  pg-gvm-migrator:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/pg-gvm-migrator:stable
    deploy:
      restart_policy:
        condition: none
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql

  gvmd:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/gvmd:stable
    deploy:
      restart_policy:
        condition: any
    volumes:
      - gvmd_data_vol:/var/lib/gvm
      - scap_data_vol:/var/lib/gvm/scap-data/
      - cert_data_vol:/var/lib/gvm/cert-data
      - data_objects_vol:/var/lib/gvm/data-objects/gvmd
      - vt_data_vol:/var/lib/openvas/plugins
      - psql_data_vol:/var/lib/postgresql
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
      - psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm:
        condition: service_started
      scap-data:
        condition: service_healthy
      cert-bund-data:
        condition: service_healthy
      dfn-cert-data:
        condition: service_healthy
      data-objects:
        condition: service_healthy
      report-formats:
        condition: service_healthy

  gsa:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/gsa:stable-slim
    environment:
      MOUNT_PATH: "/mnt/web"
      KEEP_ALIVE: 1
    healthcheck:
      test: [ "CMD-SHELL", "test -e /run/gsa/copying.done" ]
      start_period: 5s
    volumes:
      - gsa_data_vol:/mnt/web

  gsad:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/gsad:stable
    deploy:
      restart_policy:
        condition: any
    environment:
      GSAD_HTTP_ONLY: "true"
      GSAD_API_ONLY: "true"
      GSAD_FOREGROUND: "true"
    volumes:
      - gvmd_socket_vol:/run/gvmd
    depends_on:
      gvmd:
        condition: service_started

  gvm-config:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/gvm-config:latest
    environment:
      ENABLE_NGINX_CONFIG: true
      ENABLE_TLS_GENERATION: true
    volumes:
      - nginx_config_vol:/mnt/nginx/configs
      - nginx_certificates_vol:/mnt/nginx/certs

  nginx:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/nginx:latest
    ports:
      # веб-интерфейс GSA (https) и API: по умолчанию только localhost;
      # для доступа с других машин: GC_GSA_PORT=0.0.0.0:8443 и т.п.
      - ${GC_GSA_PORT:-127.0.0.1:443}:443
      - ${GC_GSA_API_PORT:-127.0.0.1:9392}:9392
    volumes:
      - nginx_config_vol:/etc/nginx/conf.d:ro
      - nginx_certificates_vol:/etc/nginx/certs:ro
      - gsa_data_vol:/usr/share/nginx/html:ro
    deploy:
      restart_policy:
        condition: any
    depends_on:
      gvm-config:
        condition: service_completed_successfully
      gsa:
        condition: service_healthy
      gsad:
        condition: service_started

  # Уровень лога openvas и путь логов — в /var/log/openvas
  configure-openvas:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log

  # показывает логи openvas
  openvas:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/openvas/openvas.conf
        tail -f /var/log/openvas/openvas.log
    depends_on:
      configure-openvas:
        condition: service_completed_successfully

  openvasd:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    deploy:
      restart_policy:
        condition: any
    environment:
      # service_notus — только notus; чтобы использовать openvasd напрямую,
      # уберите OPENVASD_MODE
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - gpg_data_vol:/etc/openvas/gnupg
      - notus_data_vol:/var/lib/notus
    depends_on:
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
      configure-openvas:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - openvasd

  ospd-openvas:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/ospd-openvas:stable
    deploy:
      restart_policy:
        condition: any
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN # for capturing packages in promiscuous mode
      - NET_RAW # for raw sockets e.g. used for the boreas alive detection
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      [
        "ospd-openvas",
        "-f",
        "--config",
        "/etc/gvm/ospd-openvas.conf",
        "--notus-feed-dir",
        "/var/lib/notus/advisories",
        "-m",
        "666",
      ]
    volumes:
      - gpg_data_vol:/etc/openvas/gnupg
      - vt_data_vol:/var/lib/openvas/plugins
      - notus_data_vol:/var/lib/notus
      - ospd_openvas_socket_vol:/run/ospd
      - redis_socket_vol:/run/redis/
      - openvas_data_vol:/etc/openvas/
      - openvas_log_data_vol:/var/log/openvas
    depends_on:
      redis-server:
        condition: service_started
      gpg-data:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy

  gvm-tools:
    profiles: ["greenbone"]
    image: registry.community.greenbone.net/community/gvm-tools
    volumes:
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
    depends_on:
      - gvmd
      - ospd-openvas

volumes:
  gpg_data_vol:
  scap_data_vol:
  cert_data_vol:
  data_objects_vol:
  gvmd_data_vol:
  psql_data_vol:
  vt_data_vol:
  notus_data_vol:
  psql_socket_vol:
  gvmd_socket_vol:
  ospd_openvas_socket_vol:
  redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:
  gsa_data_vol:
  nginx_config_vol:
  nginx_certificates_vol:

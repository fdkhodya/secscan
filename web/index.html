<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>secscan — сканирование</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#0f1115; color:#e6e6e6; }
  header { display:flex; align-items:center; gap:14px; padding:14px 22px; background:#14171d; border-bottom:1px solid #232834; }
  header h1 { font-size:18px; margin:0; } header h1 span { color:#2f6fed; }
  .logout { margin-left:auto; color:#8b93a3; font-size:13px; text-decoration:none; }
  main { max-width:1080px; margin:22px auto; padding:0 18px; }
  .scan-row { display:flex; gap:10px; }
  #target { flex:1; padding:11px 12px; border-radius:10px; border:1px solid #2c323d; background:#14171d; color:#eee; font-size:15px; }
  #run { padding:11px 22px; border:0; border-radius:10px; background:#2f6fed; color:#fff; font-size:15px; cursor:pointer; }
  #run:disabled { opacity:.5; cursor:wait; }
  .hint { color:#7d8594; font-size:12px; margin:8px 2px; }
  .settings { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:10px 0 4px; padding:10px 12px; background:#14171d; border:1px solid #232834; border-radius:10px; font-size:13px; }
  .s-title { color:#8b93a3; font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  .sw { display:inline-flex; align-items:center; gap:6px; cursor:pointer; color:#cdd5e0; }
  .sw input { accent-color:#2f6fed; width:15px; height:15px; }
  table { width:100%; border-collapse:collapse; margin-top:18px; font-size:14px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid #20242e; }
  th { color:#8b93a3; font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  .st { padding:3px 9px; border-radius:20px; font-size:12px; }
  .st-queued { background:#2a2f3a; color:#aab2c0; }
  .st-running { background:#1e3a5f; color:#7ab8ff; }
  .st-done { background:#173a26; color:#6ee7a0; }
  .st-error { background:#4a1d1d; color:#fca5a5; }
  a.report { color:#7ab8ff; text-decoration:none; }
  .empty { color:#5b6372; text-align:center; padding:40px; }
  #err { color:#f87171; font-size:13px; margin-top:8px; min-height:16px; }
  th.chk, td.chk { width:28px; padding-right:0; }
  .sel, #sel-all { accent-color:#2f6fed; width:15px; height:15px; cursor:pointer; }
  .sel:disabled { opacity:.25; cursor:default; }
  .bulk { display:flex; align-items:center; gap:12px; margin-top:14px; }
  #del-sel { padding:9px 18px; border:0; border-radius:10px; background:#a13030; color:#fff; font-size:14px; cursor:pointer; }
  #del-sel:disabled { opacity:.35; cursor:not-allowed; }
  .bulk-hint { color:#7d8594; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>sec<span>scan</span></h1>
  <form method="post" action="/logout" style="margin-left:auto"><button type="submit" class="logout" style="background:none;border:0;cursor:pointer">Выйти</button></form>
</header>
<main>
  <div class="scan-row">
    <input id="target" placeholder="IP-адрес, домен или http(s)://url — например 192.168.7.7 или https://example.com" autocomplete="off">
    <button id="run" onclick="startScan()">Сканировать</button>
  </div>
  <div id="err"></div>
  <div class="settings">
    <span class="s-title">Виды проверок:</span>
    <label class="sw"><input type="checkbox" id="sw-nmap" checked disabled> nmap (порты/сервисы)</label>
    <label class="sw"><input type="checkbox" id="sw-zap"> OWASP ZAP (веб)</label>
    <label class="sw"><input type="checkbox" id="sw-openvas"> OpenVAS (Greenbone)</label>
    <label class="sw"><input type="checkbox" id="sw-vulners"> NSE vulners (CVE по nmap)</label>
  </div>
  <table>
    <thead><tr><th class="chk"><input type="checkbox" id="sel-all" title="Выбрать завершённые"></th><th>ID</th><th>Цель</th><th>Статус</th><th>Этап</th><th>Начало</th><th></th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="empty">Задач пока нет</td></tr></tbody>
  </table>
  <div class="bulk">
    <button id="del-sel" disabled>Удалить выбранные</button>
    <span id="sel-count" class="bulk-hint"></span>
    <span class="bulk-hint">удаляются только завершённые задачи (done/error)</span>
  </div>
</main>
<script>
let lastId = '';
const selected = new Set(); // id выбранных завершённых задач (переживает перерисовку списка)
async function startScan() {
  const t = document.getElementById('target').value.trim();
  if (!t) return;
  const btn = document.getElementById('run');
  btn.disabled = true;
  document.getElementById('err').textContent = '';
  try {
    const r = await fetch('/api/scans', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({target:t})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    document.getElementById('target').value = '';
  } catch(e) { document.getElementById('err').textContent = 'Ошибка: ' + e.message; }
  btn.disabled = false;
  refresh();
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// локальное время браузера из ISO-строки (сервер хранит RFC3339)
function fmtLocal(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
async function refresh() {
  try {
    const r = await fetch('/api/scans');
    const jobs = await r.json();
    const tb = document.getElementById('rows');
    if (!jobs.length) { tb.innerHTML = '<tr><td colspan="7" class="empty">Задач пока нет</td></tr>'; updateSelected(); return; }
    tb.innerHTML = jobs.map(j => {
      const done = j.status === 'done';
      const err = j.status === 'error';
      const finished = done || err;
      const report = finished ? `<a class="report" href="/reports/${esc(j.id)}">отчёт</a>` : '';
      const chk = `<input type="checkbox" class="sel" data-id="${esc(j.id)}"${finished ? (selected.has(j.id) ? ' checked' : '') : ' disabled'}>`;
      return `<tr>
        <td class="chk">${chk}</td>
        <td>${esc(j.id)}</td><td>${esc(j.target)}</td>
        <td><span class="st st-${esc(j.status)}">${esc(j.status)}</span></td>
        <td>${esc(j.stage || '')}${err ? ' <span style="color:#f87171">'+esc(j.error||'')+'</span>' : ''}</td>
        <td>${fmtLocal(j.created_at)}</td><td>${report}</td></tr>`;
    }).join('');
    updateSelected();
  } catch(e) {}
}
setInterval(refresh, 3000);
refresh();

// ---- выбор и удаление отчётов ----
function updateSelected() {
  selected.clear();
  document.querySelectorAll('#rows .sel:checked').forEach(cb => selected.add(cb.dataset.id));
  const btn = document.getElementById('del-sel');
  btn.disabled = selected.size === 0;
  document.getElementById('sel-count').textContent = selected.size ? `выбрано: ${selected.size}` : '';
}
document.getElementById('sel-all').addEventListener('change', e => {
  document.querySelectorAll('#rows .sel:not(:disabled)').forEach(cb => { cb.checked = e.target.checked; });
  updateSelected();
});
document.getElementById('rows').addEventListener('change', e => {
  if (e.target.classList && e.target.classList.contains('sel')) updateSelected();
});
document.getElementById('del-sel').addEventListener('click', async () => {
  const ids = [...selected];
  if (!ids.length) return;
  if (!confirm(`Удалить выбранные отчёты (${ids.length})? Действие необратимо.`)) return;
  try {
    const r = await fetch('/api/scans', {method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ids})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    selected.clear();
    refresh();
  } catch(e) { document.getElementById('err').textContent = 'Ошибка удаления: ' + e.message; }
});

// ---- настройки (переключатели) ----
let settings = {zap_enabled:false, openvas_enabled:false, vulners:false};
async function loadSettings() {
  try {
    const r = await fetch('/api/settings');
    settings = await r.json();
    document.getElementById('sw-zap').checked = !!settings.zap_enabled;
    document.getElementById('sw-openvas').checked = !!settings.openvas_enabled;
    document.getElementById('sw-vulners').checked = !!settings.vulners;
  } catch(e) {}
}
async function saveSettings() {
  settings.zap_enabled = document.getElementById('sw-zap').checked;
  settings.openvas_enabled = document.getElementById('sw-openvas').checked;
  settings.vulners = document.getElementById('sw-vulners').checked;
  try {
    await fetch('/api/settings', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(settings)});
  } catch(e) {}
}
document.getElementById('sw-zap').addEventListener('change', saveSettings);
document.getElementById('sw-openvas').addEventListener('change', saveSettings);
document.getElementById('sw-vulners').addEventListener('change', saveSettings);
loadSettings();
</script>
</body>
</html>
